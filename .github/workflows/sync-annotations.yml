name: Sync annotations from the tool

# Downloads the annotation tool's canonical export (the admin "Download all" CSV,
# which merges live + archived filings and includes the adjudicated/final columns)
# and commits it to tool-exports/annotations.csv. Runs daily and on demand.
#
# How it works: the job logs into the live tool as a dedicated read-only service
# account and downloads /export.csv. All the query work happens inside the app,
# next to the database, so it finishes in under a minute. The tool and its
# database are never modified; only tool-exports/ in this repo is written, and
# only when the CSV actually changed.
#
# Required repo secret (Settings -> Secrets and variables -> Actions):
#   EXPORT_BOT_PASSWORD  - password for the "export-bot" account on the tool.
# The app URL and account name are not secret and are set below.

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily
  workflow_dispatch: {}    # manual "Run workflow" button

concurrency:
  group: sync-annotations
  cancel-in-progress: false

permissions:
  contents: write          # to commit tool-exports/ back to this repo

env:
  APP_URL: "https://10k-annotation-tool-production.up.railway.app"
  EXPORT_BOT_USER: "export-bot"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Download the annotations export
        env:
          EXPORT_BOT_PASSWORD: ${{ secrets.EXPORT_BOT_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p tool-exports
          COOKIES="$(mktemp)"

          # 1. Log in (form POST). A successful login redirects (302) and sets a
          #    session cookie. Fail loudly if we don't get one.
          LOGIN_CODE="$(curl -sS -c "$COOKIES" -o /dev/null -w '%{http_code}' \
            --data-urlencode "name=$EXPORT_BOT_USER" \
            --data-urlencode "password=$EXPORT_BOT_PASSWORD" \
            "$APP_URL/login")"
          echo "login http_code=$LOGIN_CODE"
          if [ "$LOGIN_CODE" != "302" ]; then
            echo "::error::Login did not return 302 (got $LOGIN_CODE). Check EXPORT_BOT_PASSWORD."
            exit 1
          fi

          # 2. Download the full export to a temp file (never straight onto the
          #    committed file, so a bad run can't clobber the last good CSV).
          TMP="$(mktemp)"
          DL_CODE="$(curl -sS -b "$COOKIES" -o "$TMP" -w '%{http_code}' "$APP_URL/export.csv")"
          echo "download http_code=$DL_CODE size=$(wc -c < "$TMP") bytes"
          if [ "$DL_CODE" != "200" ]; then
            echo "::error::Export download failed (http $DL_CODE)."
            exit 1
          fi

          # 3. Sanity-check it's really the CSV (right header) and non-trivial,
          #    so an error/login page can never be committed as data.
          HEADER="$(head -1 "$TMP")"
          case "$HEADER" in
            cik,company,year,accession,*) : ;;
            *) echo "::error::Unexpected header: $HEADER"; exit 1 ;;
          esac
          echo "header: $HEADER"
          # Count real CSV records: a note can contain a line break, so wc -l over-counts.
          ROWS="$(python3 -c 'import csv,sys; csv.field_size_limit(2**31-1); f=open(sys.argv[1], newline=""); r=csv.reader(f); next(r); print(sum(1 for _ in r))' "$TMP")"
          echo "data rows: $ROWS"
          if [ "$ROWS" -lt 100 ]; then
            echo "::error::Only $ROWS rows — refusing to overwrite the last good export."
            exit 1
          fi

          mv "$TMP" tool-exports/annotations.csv

          # 4. Manifest (timestamp + row count) so the folder is self-describing.
          {
            echo "# tool-exports — manifest"
            echo
            echo "Auto-generated by the \`Sync annotations from the tool\` workflow. Do not edit by hand."
            echo
            echo "- Generated (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Annotation rows: $ROWS"
            echo
            echo "\`annotations.csv\` is the tool's canonical \"Download all\" export (live +"
            echo "archived filings) including the adjudicated/final columns"
            echo "(\`adjudicated_status\`, \`final_kind/category/subcategory/strength\`, \`final_tags\`)."
            echo "\`filings.csv\` is one row per filing (annotators, counts, finalized/archived state,"
            echo "and filings that had no AI content). \`final_labels.csv\` is one row per tagged"
            echo "sentence with the label that stands after adjudication."
          } > tool-exports/MANIFEST.md

      - name: Download the filings export (one row per filing)
        env:
          EXPORT_BOT_PASSWORD: ${{ secrets.EXPORT_BOT_PASSWORD }}
        run: |
          set -euo pipefail
          COOKIES="$(mktemp)"
          LOGIN_CODE="$(curl -sS -c "$COOKIES" -o /dev/null -w '%{http_code}' \
            --data-urlencode "name=$EXPORT_BOT_USER" \
            --data-urlencode "password=$EXPORT_BOT_PASSWORD" \
            "$APP_URL/login")"
          if [ "$LOGIN_CODE" != "302" ]; then
            echo "::error::Login did not return 302 (got $LOGIN_CODE)."
            exit 1
          fi
          TMP="$(mktemp)"
          DL_CODE="$(curl -sS -b "$COOKIES" -o "$TMP" -w '%{http_code}' "$APP_URL/export-filings.csv")"
          echo "filings download http_code=$DL_CODE size=$(wc -c < "$TMP") bytes"
          if [ "$DL_CODE" != "200" ]; then
            echo "::error::filings.csv download failed (http $DL_CODE)."
            exit 1
          fi
          HEADER="$(head -1 "$TMP")"
          echo "filings header: $HEADER"
          case "$HEADER" in
            doc_id,cik,company,year,accession,*) : ;;
            *) echo "::error::Unexpected filings header: $HEADER"; exit 1 ;;
          esac
          ROWS="$(python3 -c 'import csv,sys; csv.field_size_limit(2**31-1); f=open(sys.argv[1], newline=""); r=csv.reader(f); next(r); print(sum(1 for _ in r))' "$TMP")"
          echo "filing rows: $ROWS"
          if [ "$ROWS" -lt 1 ]; then
            echo "::error::filings.csv is empty — refusing to overwrite the last good file."
            exit 1
          fi
          mv "$TMP" tool-exports/filings.csv
          sed -i "s/^- Annotation rows: .*/&\n- Filing rows: $ROWS/" tool-exports/MANIFEST.md

      - name: Download the final labels export (one row per tagged sentence)
        env:
          EXPORT_BOT_PASSWORD: ${{ secrets.EXPORT_BOT_PASSWORD }}
        run: |
          set -euo pipefail
          COOKIES="$(mktemp)"
          LOGIN_CODE="$(curl -sS -c "$COOKIES" -o /dev/null -w '%{http_code}' \
            --data-urlencode "name=$EXPORT_BOT_USER" \
            --data-urlencode "password=$EXPORT_BOT_PASSWORD" \
            "$APP_URL/login")"
          if [ "$LOGIN_CODE" != "302" ]; then
            echo "::error::Login did not return 302 (got $LOGIN_CODE)."
            exit 1
          fi
          TMP="$(mktemp)"
          DL_CODE="$(curl -sS -b "$COOKIES" -o "$TMP" -w '%{http_code}' "$APP_URL/export-final-labels.csv")"
          echo "final labels download http_code=$DL_CODE size=$(wc -c < "$TMP") bytes"
          if [ "$DL_CODE" != "200" ]; then
            echo "::error::final_labels.csv download failed (http $DL_CODE)."
            exit 1
          fi
          HEADER="$(head -1 "$TMP")"
          echo "final labels header: $HEADER"
          case "$HEADER" in
            doc_id,cik,company,year,accession,*) : ;;
            *) echo "::error::Unexpected final labels header: $HEADER"; exit 1 ;;
          esac
          ROWS="$(python3 -c 'import csv,sys; csv.field_size_limit(2**31-1); f=open(sys.argv[1], newline=""); r=csv.reader(f); next(r); print(sum(1 for _ in r))' "$TMP")"
          echo "final label rows: $ROWS"
          if [ "$ROWS" -lt 100 ]; then
            echo "::error::Only $ROWS final label rows — refusing to overwrite the last good file."
            exit 1
          fi
          mv "$TMP" tool-exports/final_labels.csv
          sed -i "s/^- Filing rows: .*/&\n- Final label rows: $ROWS/" tool-exports/MANIFEST.md

      - name: Split into per-company / per-year CSVs
        # Pure local post-processing on the CSV just downloaded — no tool/DB access.
        # Uses only the Python standard library (python3 is preinstalled on the runner).
        run: python3 scripts/split_by_company.py

      - name: Commit if changed
        run: |
          git config user.name  "annotations-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          # Stage ONLY the export folder so nothing else in the repo can change.
          git add tool-exports/
          if git diff --cached --quiet; then
            echo "No changes in tool-exports/ — nothing to commit."
          else
            git commit -m "Sync annotations ($(date -u +%Y-%m-%d))"
            git push
          fi
